bundle:
  name: energy-demand-weather-lakehouse
variables:
  catalog:
    default: workspace
  schema:
    default: energy_platform
  warehouse_id:
    description: Your SQL warehouse ID; supply through local configuration.
  secret_scope:
    default: energy-platform
resources:
  dashboards:
    energy_dashboard:
      display_name: Energy demand and generation composition
      file_path: ./dashboards/energy.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: false
  jobs:
    energy_pipeline:
      name: energy-demand-weather-pipeline
      max_concurrent_runs: 1
      timeout_seconds: 7200
      parameters:
        - name: start_date
          default: ''
        - name: end_date
          default: ''
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./notebooks/01_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              secret_scope: ${var.secret_scope}
              start_date: '{{job.parameters.start_date}}'
              end_date: '{{job.parameters.end_date}}'
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: silver
          max_retries: 0
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ingestion_run_id: '{{tasks.ingest.values.ingestion_run_id}}'
        - task_key: gold_and_tests
          max_retries: 0
          depends_on:
            - task_key: silver
          dbt_task:
            project_directory: ./dbt
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}
            commands:
              - 'dbt seed --threads 1'
              - 'dbt build --threads 1 --vars "{source_catalog: ${var.catalog}, source_schema: ${var.schema}}"'
          environment_key: dbt_environment
        - task_key: publish
          max_retries: 0
          depends_on:
            - task_key: gold_and_tests
          notebook_task:
            notebook_path: ./notebooks/03_publish.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ingestion_run_id: '{{tasks.ingest.values.ingestion_run_id}}'
      environments:
        - environment_key: dbt_environment
          spec:
            environment_version: '4'
            dependencies:
              - dbt-databricks==1.12.6
      schedule:
        quartz_cron_expression: '0 0 10 * * ?'
        timezone_id: UTC
        pause_status: PAUSED
targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: ~/energy-demand-weather-lakehouse/bundle
